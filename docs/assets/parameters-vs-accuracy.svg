  <g id="text_23">
   <text style="fill: #687184; font: 10px 'DejaVu Sans'; text-anchor: start" x="82.08" y="511.488" transform="rotate(-0 82.08 511.488)">Mars Preview uses task training and constrained decoding; Qwen uses a fixed prompt and free JSON.</text>
